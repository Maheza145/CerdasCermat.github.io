<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerdas Cermat Makrab HIMATIF 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
:root {
  --brown: #62260E;
  --rust: #9B5B2A;
  --olive: #9A9468;
  --cream: #E5D5AB;
  --bg: #F1EBE2;
  --card: #FBF8F3;
  --ink: #2A1408;
  --mut: #7a6552;
  --line: #dccfbd;
  --nav: #1d0e06;
  --navink: #F1EBE2;
  --correct: #2e7d32;
  --correct-bg: #e8f5e9;
  --wrong: #c62828;
  --wrong-bg: #ffebee;
}

@media(prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a0e07;
    --card: #26150b;
    --ink: #F1EBE2;
    --mut: #b7a38a;
    --line: #43291a;
    --nav: #E5D5AB;
    --navink: #2A1408;
    --brown: #E5D5AB;
    --correct: #81c784;
    --correct-bg: #1b381e;
    --wrong: #ef9a9a;
    --wrong-bg: #3e1b1b;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 "Inter Tight", system-ui, sans-serif;
  min-height: 100vh;
}
.serif { font-family: "Instrument Serif", Georgia, serif; }
.wrap { max-width: 860px; margin: 0 auto; padding: 16px 20px 60px; }

nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--nav);
  color: var(--navink);
  border-radius: 999px;
  padding: 10px 14px 10px 22px;
  font-weight: 500;
  margin-bottom: 24px;
}
nav b { font-weight: 600; font-size: 19px; }

.btn {
  font: inherit;
  cursor: pointer;
  border: 1px solid var(--ink);
  background: transparent;
  color: var(--ink);
  border-radius: 999px;
  padding: 10px 24px;
  font-weight: 500;
  transition: .15s;
}
.btn:hover { background: var(--ink); color: var(--bg); }
.btn.solid { background: var(--nav); color: var(--navink); border-color: var(--nav); }
.btn.solid:hover { opacity: .9; }
.btn.sm { padding: 6px 16px; font-size: 14px; }
nav .btn { border-color: var(--navink); color: var(--navink); }
nav .btn:hover { background: var(--navink); color: var(--nav); }

/* Home / Babak Selection */
.hero { margin: 24px 0 32px; }
.hero h1 {
  font-size: clamp(34px, 7vw, 60px);
  line-height: 1.08;
  letter-spacing: -.03em;
  margin-bottom: 12px;
  font-weight: 500;
}
.hero p { color: var(--mut); font-size: 17px; max-width: 60ch; }

.round-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; margin-top: 24px; }
.round-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  cursor: pointer;
  text-align: left;
  transition: .2s;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.round-card:hover {
  border-color: var(--rust);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(60,25,8,.08);
}
.round-card .tag {
  display: inline-block;
  align-self: flex-start;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  background: var(--brown);
  color: var(--cream);
  padding: 3px 10px;
  border-radius: 999px;
}
.round-card h3 { font-size: 24px; font-weight: 600; margin-top: 4px; }
.round-card p { font-size: 14px; color: var(--mut); flex: 1; }
.round-card .meta { font-size: 13px; font-weight: 600; color: var(--rust); margin-top: 10px; }

/* Quiz View */
.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
  font-size: 15px;
}
.quiz-top .info-badge {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 4px 12px;
  border-radius: 999px;
  font-weight: 500;
}
.quiz-top .score-box { font-weight: 600; }
.quiz-top .score-box b { font-size: 24px; color: var(--rust); }

.progress-bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 24px; }
.progress-fill { height: 100%; background: var(--rust); transition: width .3s ease; }

.section-label {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--rust);
  margin-bottom: 8px;
}
.q-title {
  font-size: clamp(22px, 4.5vw, 32px);
  font-weight: 500;
  line-height: 1.25;
  margin-bottom: 24px;
}

/* Options */
.options-grid { display: flex; flex-direction: column; gap: 12px; }
.opt-btn {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  cursor: pointer;
  font: inherit;
  color: inherit;
  text-align: left;
  transition: .18s;
  width: 100%;
}
.opt-btn:hover:not(:disabled) {
  border-color: var(--rust);
  background: var(--bg);
}
.opt-btn .key {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  border: 1px solid var(--line);
  font-weight: 700;
  font-size: 14px;
  flex-shrink: 0;
}
.opt-btn .text { flex: 1; font-size: 16px; font-weight: 500; }

.opt-btn.correct {
  background: var(--correct-bg);
  border-color: var(--correct);
  color: var(--correct);
  font-weight: 600;
}
.opt-btn.correct .key {
  background: var(--correct);
  color: #fff;
  border-color: var(--correct);
}
.opt-btn.wrong {
  background: var(--wrong-bg);
  border-color: var(--wrong);
  color: var(--wrong);
}
.opt-btn.wrong .key {
  background: var(--wrong);
  color: #fff;
  border-color: var(--wrong);
}

/* Benar / Salah Buttons */
.tf-container { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.tf-btn {
  padding: 22px;
  font-size: 20px;
  font-weight: 600;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--line);
  cursor: pointer;
  color: inherit;
  transition: .2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.tf-btn:hover:not(:disabled) {
  border-color: var(--rust);
  transform: translateY(-2px);
}
.tf-btn.correct { background: var(--correct-bg); border-color: var(--correct); color: var(--correct); }
.tf-btn.wrong { background: var(--wrong-bg); border-color: var(--wrong); color: var(--wrong); }

/* Isian Singkat */
.isian-box { margin-top: 10px; }
.isian-box input {
  width: 100%;
  font: inherit;
  font-size: 18px;
  padding: 14px 18px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  outline: none;
  margin-bottom: 12px;
}
.isian-box input:focus { border-color: var(--rust); }

/* Explanation / Discussion */
.feedback-box {
  margin-top: 24px;
  padding: 18px 22px;
  border-radius: 12px;
  background: var(--card);
  border: 1px solid var(--line);
}
.feedback-status {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.feedback-status.ok { color: var(--correct); }
.feedback-status.no { color: var(--wrong); }
.feedback-key {
  font-size: 15px;
  margin-bottom: 6px;
}
.feedback-exp {
  font-size: 14px;
  color: var(--mut);
  line-height: 1.5;
}

.bottom-action { margin-top: 24px; display: flex; justify-content: flex-end; }

/* End Screen */
.end-view { text-align: center; padding: 40px 0; }
.end-view h2 { font-size: clamp(32px, 6vw, 48px); font-weight: 500; margin-bottom: 12px; }
.end-view .big-score {
  font-size: clamp(70px, 16vw, 130px);
  line-height: 1;
  font-weight: 500;
  color: var(--rust);
  margin: 16px 0;
}
.end-view p { color: var(--mut); font-size: 17px; max-width: 50ch; margin: 0 auto; }
.end-view .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
</style>
</head>

        keys: ["mengevaluasi kebutuhan dan menyusun anggaran ulang", "evaluasi anggaran", "evaluasi kebutuhan", "susun anggaran ulang", "efisiensi anggaran", "revisi anggaran", "mengevaluasi kebutuhan"],
        exp: "Panitia perlu meninjau prioritas kebutuhan pos pengeluaran yang bisa diefisiensikan sebelum mencari opsi pendanaan tambahan."

let state = {
  screen: "home",
  roundIdx: 0,
  qIdx: 0,
  score: 0,
  selectedAns: null,
  isSubmitted: false,
  isCorrect: false
};

const app = document.getElementById("app");

function normStr(str) {
  return (str || "").toLowerCase().replace(/[^a-z0-9]/g, ' ').replace(/\s+/g, ' ').trim();
}

function checkShortAnswer(input, keys, expected) {
  const normInp = normStr(input);
  if (!normInp) return false;
  if (normInp === normStr(expected)) return true;
  return keys.some(k => {
    const nk = normStr(k);
    return normInp === nk || normInp.includes(nk);
  });
}

function render() {
  if (state.screen === "home") {
    renderHome();
  } else if (state.screen === "quiz") {
    renderQuiz();
  } else if (state.screen === "end") {
    renderEnd();
  }
}

function renderHome() {
  app.innerHTML = `
    <div class="hero">
      <h1 class="serif">Cerdas Cermat HIMATIF</h1>
      <p>Pilih babak kompetisi yang ingin dimainkan. Setiap babak berisi 20 soal terstruktur (Pilihan Ganda, Benar/Salah, dan Isian Singkat).</p>
    </div>
    <div class="round-cards">
      ${DATA_ROUNDS.map((r, i) => `
        <div class="round-card" onclick="startRound(${i})">
          <span class="tag">${r.id.toUpperCase()}</span>
          <h3>${r.name}</h3>
          <p>${r.desc}</p>
          <div class="meta">${r.questions.length} Soal · 10 Poin / Soal →</div>
        </div>
      `).join("")}
    </div>
  `;
}

function startRound(idx) {
  state.roundIdx = idx;
  state.qIdx = 0;
  state.score = 0;
  state.selectedAns = null;
  state.isSubmitted = false;
  state.isCorrect = false;
  state.screen = "quiz";
  render();
}

function renderQuiz() {
  const round = DATA_ROUNDS[state.roundIdx];
  const q = round.questions[state.qIdx];
  const total = round.questions.length;
  const progressPercent = ((state.qIdx + (state.isSubmitted ? 1 : 0)) / total) * 100;

  let inputHtml = "";

  if (q.type === "mc") {
    inputHtml = `
      <div class="options-grid">
        ${q.opts.map(opt => {
          let extraClass = "";
          if (state.isSubmitted) {
            if (opt.k === q.ans) extraClass = "correct";
            else if (opt.k === state.selectedAns) extraClass = "wrong";
          }
          return `
            <button class="opt-btn ${extraClass}" onclick="submitMC('${opt.k}')" ${state.isSubmitted ? "disabled" : ""}>
              <span class="key">${opt.k}</span>
              <span class="text">${opt.t}</span>
            </button>
          `;
        }).join("")}
      </div>
    `;
  } else if (q.type === "tf") {
    inputHtml = `
      <div class="tf-container">
        ${["Benar", "Salah"].map(val => {
          let extraClass = "";
          if (state.isSubmitted) {
            if (val === q.ans) extraClass = "correct";
            else if (val === state.selectedAns) extraClass = "wrong";
          }
          return `
            <button class="tf-btn ${extraClass}" onclick="submitTF('${val}')" ${state.isSubmitted ? "disabled" : ""}>
              <span>${val === "Benar" ? "✓" : "✗"}</span> ${val}
            </button>
          `;
        }).join("")}
      </div>
    `;
  } else if (q.type === "short") {
    if (!state.isSubmitted) {
      inputHtml = `
        <div class="isian-box">
          <input type="text" id="short-input" placeholder="Ketik jawabanmu di sini..." autocomplete="off">
          <button class="btn solid" onclick="submitShort()">Kirim Jawaban</button>
        </div>
      `;
    }
  }

  let feedbackHtml = "";
  if (state.isSubmitted) {
    feedbackHtml = `
      <div class="feedback-box">
        <div class="feedback-status ${state.isCorrect ? 'ok' : 'no'}">
          ${state.isCorrect ? '✓ Jawaban Tepat! (+10 Poin)' : '✗ Jawaban Belum Tepat (+0 Poin)'}
        </div>
        <div class="feedback-key">
          <strong>Kunci Jawaban:</strong> ${q.ans}
        </div>
        <div class="feedback-exp">
          <strong>Penjelasan:</strong> ${q.exp}
        </div>
      </div>
      <div class="bottom-action">
        <button class="btn solid" onclick="nextQuestion()">
          ${state.qIdx + 1 < total ? 'Soal Berikutnya →' : 'Lihat Hasil Akhir'}
        </button>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="quiz-top">
      <span class="info-badge">${round.name}</span>
      <span class="info-badge">Soal ${state.qIdx + 1} dari ${total}</span>
      <div class="score-box">Skor: <b>${state.score}</b></div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" style="width: ${progressPercent}%;"></div>
    </div>

    <div class="section-label">${q.sec}</div>
    <h2 class="serif q-title" style="white-space: pre-line;">${q.q}</h2>

    ${inputHtml}
    ${feedbackHtml}
  `;

  if (q.type === "short" && !state.isSubmitted) {
    const inp = document.getElementById("short-input");
    if (inp) {
      inp.focus();
      inp.onkeydown = e => { if (e.key === "Enter") submitShort(); };
    }
  }
}

function submitMC(key) {
  if (state.isSubmitted) return;
  const q = DATA_ROUNDS[state.roundIdx].questions[state.qIdx];
  state.selectedAns = key;
  state.isSubmitted = true;
  state.isCorrect = (key === q.ans);
  if (state.isCorrect) state.score += 10;
  render();
}

function submitTF(val) {
  if (state.isSubmitted) return;
  const q = DATA_ROUNDS[state.roundIdx].questions[state.qIdx];
  state.selectedAns = val;
  state.isSubmitted = true;
  state.isCorrect = (val === q.ans);
  if (state.isCorrect) state.score += 10;
  render();
}

function submitShort() {
  if (state.isSubmitted) return;
  const inp = document.getElementById("short-input");
  if (!inp || !inp.value.trim()) return;

  const val = inp.value.trim();
  const q = DATA_ROUNDS[state.roundIdx].questions[state.qIdx];
  state.selectedAns = val;
  state.isSubmitted = true;
  state.isCorrect = checkShortAnswer(val, q.keys || [q.ans], q.ans);
  if (state.isCorrect) state.score += 10;
  render();
}

function nextQuestion() {
  const round = DATA_ROUNDS[state.roundIdx];
  if (state.qIdx + 1 < round.questions.length) {
    state.qIdx++;
    state.selectedAns = null;
    state.isSubmitted = false;
    state.isCorrect = false;
    render();
  } else {
    state.screen = "end";
    render();
  }
}

function renderEnd() {
  const round = DATA_ROUNDS[state.roundIdx];
  const maxScore = round.questions.length * 10;
  const pct = Math.round((state.score / maxScore) * 100);

  app.innerHTML = `
    <div class="end-view">
      <span class="section-label">${round.name} Selesai</span>
      <h2 class="serif">Hasil Perolehan Skor</h2>
      <div class="big-score serif">${state.score}</div>
      <p>Total perolehan dari maksimal ${maxScore} poin (${pct}%). ${pct >= 80 ? 'Luar biasa, penguasaan materi sangat baik!' : pct >= 50 ? 'Hasil cukup baik, tingkatkan lagi untuk babak selanjutnya!' : 'Tetap semangat, pelajari kembali pembahasan soal!'}</p>
      <div class="actions">
        <button class="btn solid" onclick="startRound(${state.roundIdx})">Ulangi Babak Ini</button>
        <button class="btn" onclick="startRound(${state.roundIdx === 0 ? 1 : 0})">
          ${state.roundIdx === 0 ? 'Lanjut Babak 2 →' : 'Kembali ke Babak 1'}
        </button>
        <button class="btn" onclick="state.screen='home'; render();">Menu Utama</button>
      </div>
    </div>
  `;
}

document.getElementById("btn-nav-home").onclick = () => {
  state.screen = "home";
  render();
};

render();
</script>
